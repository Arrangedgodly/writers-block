<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The room paints its own browser chrome: theme-color is the fixed
         console-charcoal ground (--ground, tokens.css), and the favicon is
         the signature silhouette at 16px — one recessed split-flap digit
         well with the hinge seam across its middle and a bone digit —
         hand-authored SVG in the committed palette (panel-raised bezel
         #1a1d23, recessed well #0e1013, bone #e8e4d8, ground seam #14161a),
         inlined as a data URI: no external asset, no network fetch. -->
    <meta name="theme-color" content="#14161a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%231a1d23'/%3E%3Crect x='8' y='6' width='16' height='20' rx='2' fill='%230e1013'/%3E%3Crect x='12.5' y='10.5' width='7' height='11' rx='1.5' fill='none' stroke='%23e8e4d8' stroke-width='2'/%3E%3Crect x='8' y='15.5' width='16' height='1' fill='%2314161a'/%3E%3C/svg%3E"
    />
    <title>The Disappearing Draft</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT — The Disappearing Draft · The Countdown Room

      THESIS: One console through five mission phases; the clock presides, the
      draft is telemetry that dies with the signal. Refused: the serene
      writing-app canvas and its reassuring toolbar.

      OWN-WORLD: #14161a ground, bone #e8e4d8 readouts, range-safety lamps
      locked: green alive, amber fading, red destruct. Michroma placard caps,
      B612 tabular numerals, quiet grotesk prose; hairline bezels, machined
      corners, grain, no soft shadows — recognizable with all copy removed.

      STORY: The visitor arms a guarded countdown, keeps typing, watches the
      draft pale under an amber hairline band — DOWN SAFE archives it;
      SIGNAL LOST destroys it; re-arm is one motion. The threat is believed
      because it is real.

      FIRST VIEWPORT: Setup console: the split-flap duration board presides
      top-center at display scale; GENTLE / STANDARD / BRUTAL placards with
      printed FADE and LOSS limits below; the guarded ARM sits low, isolated
      in space — the room's one primary action.

      FORM: Mission-control countdown room — split-flap boards, range-safety
      lamps; 7th of 7 grounded candidates; seed da64ca22.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance
    -->
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
